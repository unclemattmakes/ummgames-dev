<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }
      #stage {
        position: relative;
        overflow: hidden;
      }
      #stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #title {
        position: absolute;
        left: 8px;
        bottom: 8px;
        color: #fff;
        font: bold 24px sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="title">FIXTURE</div></div>
    <script>
      window.READY = false
      const S = window.STORE
      const stage = document.getElementById('stage')
      stage.style.width = `${S.w}px`
      stage.style.height = `${S.h}px`
      const img = new Image()
      img.src = S.plates.main
      stage.prepend(img)
      img.decode().then(() => {
        window.READY = true
      })
    </script>
  </body>
</html>
